name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Manifests parse
        run: |
          for f in \
            .claude-plugin/marketplace.json \
            plugins/unpaged/.claude-plugin/plugin.json \
            plugins/unpaged/.mcp.json \
            plugins/unpaged/hooks/hooks.json \
            plugins/unpaged/hooks/plan-approved-context.json; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"
            echo "ok $f"
          done

      - name: Marketplace lists every plugin directory
        run: |
          node -e '
            const fs = require("fs");
            const listed = new Set(JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8")).plugins.map(p => p.source.replace(/^\.\//, "")));
            const present = fs.readdirSync("plugins").map(d => "plugins/" + d);
            const missing = present.filter(d => !listed.has(d));
            if (missing.length) { console.error("not listed in marketplace.json:", missing.join(", ")); process.exit(1); }
            for (const d of listed) {
              const name = JSON.parse(fs.readFileSync(d + "/.claude-plugin/plugin.json", "utf8")).name;
              console.log("ok", d, name);
            }
          '

      - name: Commands have frontmatter
        run: |
          node -e '
            const fs = require("fs");
            const dir = "plugins/unpaged/commands";
            const files = fs.readdirSync(dir).filter(f => f.endsWith(".md"));
            if (!files.length) { console.error("no command files in", dir); process.exit(1); }
            for (const f of files) {
              const s = fs.readFileSync(dir + "/" + f, "utf8");
              const m = s.match(/^---\n([\s\S]*?)\n---\n/);
              if (!m || !/^description: \S/m.test(m[1])) { console.error("missing frontmatter description:", f); process.exit(1); }
              console.log("ok", f);
            }
          '

      - name: Listener syntax
        run: node --check plugins/unpaged/monitors/listen.mjs

      - name: Tests
        run: node --test 'plugins/unpaged/monitors/*.test.mjs'
